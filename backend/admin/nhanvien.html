<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhân viên</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="layout"><aside class="side"><h2>HR Manager</h2><a href="index.html">Dashboard</a><a class="active" href="nhanvien.html">Nhân viên</a><a href="phongban.html">Phòng ban</a><a href="chucvu.html">Chức vụ</a><a href="hopdong.html">Hợp đồng</a><a href="bangluong.html">Bảng lương</a><a href="thongke.html">Thống kê</a><a href="#" onclick="logout()">Đăng xuất</a></aside><main class="main"><div class="top"><h1>Quản lý nhân viên</h1><button onclick="moThem()">+ Thêm nhân viên</button></div><div class="toolbar"><input id="keyword" placeholder="Tìm mã, họ tên, SĐT, email..." onkeydown="if(event.key==='Enter')tai()"><select id="status"><option value="">Tất cả trạng thái</option><option value="true">Đang làm việc</option><option value="false">Nghỉ việc</option></select><button onclick="tai()">Tìm kiếm</button></div><table><thead><tr><th>Mã NV</th><th>Họ tên</th><th>Phòng ban</th><th>Chức vụ</th><th>Lương cơ bản</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="tb"></tbody></table><div class="pagination"><button onclick="page--;if(page<1)page=1;tai()">‹</button><span id="pg">1</span><button onclick="page++;tai()">›</button></div></main></div><div class="modal" id="modal"><div class="modal-box"><h2 id="title">Thêm nhân viên</h2><div class="form-grid"><label>Mã NV<input id="MaNV"></label><label>Họ tên<input id="HoTen"></label><label>Ngày sinh<input id="NgaySinh" type="date"></label><label>Giới tính<input id="GioiTinh"></label><label>SĐT<input id="SoDienThoai"></label><label>Email<input id="Email"></label><label class="full">Địa chỉ<input id="DiaChi"></label><label>Ngày vào làm<input id="NgayVaoLam" type="date"></label><label>Phòng ban (ID)<input id="MaPhongBan" type="number"></label><label>Chức vụ (ID)<input id="MaChucVu" type="number"></label><label>Lương cơ bản<input id="LuongCoBan" type="number"></label><label>Trạng thái<select id="TrangThai"><option value="true">Đang làm việc</option><option value="false">Nghỉ việc</option></select></label></div><div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end"><button onclick="dong()">Hủy</button><button onclick="luu()">Lưu</button></div></div></div><script src="js/admin.js"></script><script>let page=1,totalPages=1,editId=null;function dong(){modal.classList.remove('show')}function moThem(){editId=null;title.textContent='Thêm nhân viên';document.querySelectorAll('#modal input').forEach(x=>x.value='');TrangThai.value='true';modal.classList.add('show')}async function tai(){const k=encodeURIComponent(keyword.value);let u=API+'/nhanvien/?keyword='+k+'&page='+page+'&limit=10';if(status.value)u+='&trang_thai='+status.value;try{const x=await getJson(u);totalPages=x.totalPages||1;if(page>totalPages&&totalPages>0){page=totalPages;return tai()}pg.textContent=`Trang ${page}/${totalPages||1} - ${x.total} nhân viên`;tb.innerHTML=x.data.map(n=>`<tr><td>${n.MaNV}</td><td>${n.HoTen}</td><td>${n.TenPhongBan||''}</td><td>${n.TenChucVu||''}</td><td>${Number(n.LuongCoBan||0).toLocaleString('vi-VN')}</td><td>${n.TrangThai?'Đang làm việc':'Nghỉ việc'}</td><td><button onclick='sua(${JSON.stringify(n)})'>Sửa</button> <button class="danger" onclick='xoa(${n.MaNhanVien})'>Xóa</button></td></tr>`).join('')}catch(e){alert(e.message)}}function sua(n){editId=n.MaNhanVien;title.textContent='Sửa nhân viên';for(const k of ['MaNV','HoTen','NgaySinh','GioiTinh','SoDienThoai','Email','DiaChi','NgayVaoLam','MaPhongBan','MaChucVu','LuongCoBan','TrangThai']){if(document.getElementById(k))document.getElementById(k).value=n[k]??''}modal.classList.add('show')}async function luu(){const d={MaNV:MaNV.value.trim(),HoTen:HoTen.value.trim(),NgaySinh:NgaySinh.value||null,GioiTinh:GioiTinh.value||null,SoDienThoai:SoDienThoai.value||null,Email:Email.value||null,DiaChi:DiaChi.value||null,NgayVaoLam:NgayVaoLam.value||null,MaPhongBan:MaPhongBan.value?Number(MaPhongBan.value):null,MaChucVu:MaChucVu.value?Number(MaChucVu.value):null,LuongCoBan:Number(LuongCoBan.value||0),TrangThai:TrangThai.value==='true'};try{await getJson(editId?API+'/nhanvien/'+editId:API+'/nhanvien/',{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});dong();tai()}catch(e){alert(e.message)}}async function xoa(id){if(!confirm('Bạn có chắc muốn xóa?'))return;try{await getJson(API+'/nhanvien/'+id,{method:'DELETE'});tai()}catch(e){alert(e.message)}}tai()</script></body></html>
