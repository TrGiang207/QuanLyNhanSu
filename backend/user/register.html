<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Đăng ký - Quản lý nhân sự</title>
<style>body{margin:0;font-family:Arial;background:#f3f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{width:390px;background:white;padding:32px;border-radius:18px;box-shadow:0 10px 35px #0001}h2{text-align:center;color:#102a43}label{display:block;margin-top:14px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #d5dce5;border-radius:9px}button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:9px;background:#102a43;color:white;font-size:16px;cursor:pointer}.msg{margin-top:14px;text-align:center}.back{text-align:center;margin-top:15px}</style></head>
<body><div class="box"><h2>Đăng ký tài khoản</h2><label>Mã nhân viên (có thể bỏ trống)</label><input id="MaNhanVien" type="number"><label>Tên đăng nhập</label><input id="TenDangNhap"><label>Mật khẩu</label><input id="MatKhau" type="password"><button onclick="dangKy()">Đăng ký</button><div id="msg" class="msg"></div><div class="back"><a href="login.html">Quay lại đăng nhập</a></div></div>
<script>async function dangKy(){const msg=document.getElementById('msg');const ma=document.getElementById('MaNhanVien').value.trim();const data={MaNhanVien:ma?Number(ma):null,TenDangNhap:document.getElementById('TenDangNhap').value.trim(),MatKhau:document.getElementById('MatKhau').value};if(!data.TenDangNhap||!data.MatKhau){msg.textContent='Vui lòng nhập đầy đủ thông tin';return}try{const r=await fetch('http://127.0.0.1:8000/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Đăng ký thất bại');msg.textContent=j.message+' - đang chuyển sang đăng nhập...';setTimeout(()=>location.href='login.html',1000)}catch(e){msg.textContent=e.message}}</script></body></html>
